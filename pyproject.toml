[project]
name = "elpis"
version = "0.1.0"
description = "Elpis — an independent self-hosted daily publication"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "rss", "digest", "ollama", "summarization"]
authors = [{ name = "Elpis contributors" }]
dependencies = [
  "click>=8.1",
  "cryptography>=43.0",
  "mcp[cli]>=1.12,<2",
  "feedparser>=6.0",
  "httpx[socks]>=0.27",
  "litellm>=1.84.2,<1.85",
  "tenacity>=9.0",
  "requests[socks]>=2.31",
  "itsdangerous>=2.1",
  "jinja2>=3.1",
  "markdown>=3.7",
  "numpy>=1.26",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "langdetect>=1.0.9",
  "rich>=13.0",
  "sqlite-utils>=3.37",
  "starlette>=0.38",
  "trafilatura>=1.12",
  "uvicorn>=0.32",
  "yt-dlp>=2024.1",
  "youtube-transcript-api>=1.2",
]

[project.urls]
Homepage = "https://github.com/BarryTheShen/Elpis"
Repository = "https://github.com/BarryTheShen/Elpis"
Issues = "https://github.com/BarryTheShen/Elpis/issues"
[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
]

[project.scripts]
elpis = "condenseit.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condenseit"]


[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
