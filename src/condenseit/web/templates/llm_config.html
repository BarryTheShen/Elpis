{% extends "base.html" %}
{% block content %}
<header class="page-header">
  <h1>LLM settings</h1>
  <p class="page-lead">Choose the active model and reasoning behavior. Credentials and endpoints live under Providers.</p>
</header>

{% if msg %}
<div class="flash">{{ msg }}</div>
{% endif %}

<form method="post" action="/admin/llm" class="card form-grid">
  <div class="hint" style="grid-column: 1 / -1">
    Active provider:
    <strong>{{ provider }}</strong>.
    <a href="/admin/providers">Manage providers and API keys</a>.
  </div>
  <label style="grid-column: 1 / -1">Model
    <input name="model" value="{{ model }}" required>
    <span class="hint">Use the model identifier expected by the active provider.</span>
  </label>
  <label>Reasoning effort
    <select name="reasoning_effort">
      {% for option in ['none', 'minimal', 'low', 'medium', 'high', 'xhigh'] %}
      <option value="{{ option }}" {% if reasoning_effort == option %}selected{% endif %}>
        {{ option|capitalize }}
      </option>
      {% endfor %}
    </select>
  </label>
  <label>Thinking token budget
    <input name="thinking_budget_tokens" type="number" min="0" max="100000"
      value="{{ thinking_budget_tokens }}">
    <span class="hint">0 lets the provider choose.</span>
  </label>
  <label class="checkbox-row" style="grid-column: 1 / -1">
    <input type="checkbox" name="thinking_enabled" value="on"
      {% if thinking_enabled %}checked{% endif %}>
    Enable extended thinking when supported
  </label>
  <button type="submit" class="btn">Save settings</button>
</form>
{% endblock %}
