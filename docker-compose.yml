name: elpis

# Single Elpis app serving the publication and desktop admin. A selected local
# Ollama provider remains on the host; `./data` is shared with native `elpis run`.
services:
  app:
    image: ${ELPIS_IMAGE:-elpis:${ELPIS_IMAGE_TAG:-latest}}
    build: .
    ports:
      - "127.0.0.1:8899:8899"
    environment:
      CONDENSEIT_CONFIG: /app/config.yaml
      CONDENSEIT_DATA_DIR: /app/data
      CONDENSEIT_FRONTEND_DIST: /app/frontend/dist
      CONDENSEIT_AUTH_PASSWORD: ${CONDENSEIT_AUTH_PASSWORD:?Set CONDENSEIT_AUTH_PASSWORD in .env}
      DIGEST_PWA_AUTH_PASSWORD: ${DIGEST_PWA_AUTH_PASSWORD:-}
      DIGEST_PWA_SESSION_SECRET: ${DIGEST_PWA_SESSION_SECRET:?Set DIGEST_PWA_SESSION_SECRET in .env}
      CONDENSEIT_HTTPS_ONLY: ${CONDENSEIT_HTTPS_ONLY:-0}
      OLLAMA_HOST: http://host.docker.internal:11434
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    command: ["elpis", "serve", "--host", "0.0.0.0", "--port", "8899"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
