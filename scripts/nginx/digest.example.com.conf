# Elpis nginx vhost example
# Copy this file to scripts/nginx/<your-domain>.conf, replace the domain, and
# proxy every route through FastAPI so server-side admin authorization applies.

server {
    listen 80;
    listen [::]:80;
    server_name digest.example.com;

    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/digest.example.com.access.log;
    error_log  /var/log/nginx/digest.example.com.error.log;
}
