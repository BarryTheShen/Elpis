model: "qwen/qwen3.5-flash-02-23"
# Maximum articles per digest run. Override with CONDENSEIT_MAX_ARTICLES_PER_DIGEST.
max_articles_per_digest: 50
# RSS/Atom feeds collect up to 50 entries each before ranking. Override
# per-feed with `max_items` (1-200) when a feed publishes a larger archive.

# Language for digest output. ISO 639-1 code (e.g. "en", "fr", "de") or "source"
# to auto-detect each article's language and summarize in that language.
# Default "en" produces English output regardless of the article's source language.
# Can also be changed in Admin > Settings without restarting the server.
# digest_language: "en"
# Reserve one slot per category before filling remaining slots by rank.
balance_digest_categories: true
# Maximum articles from any single category in the balanced digest.
max_articles_per_category: 5
# Articles older than this many hours are excluded from ranking.
# Set to 0 to disable the age gate.
max_article_age_hours: 36

# Digest schedule (used by the built-in scheduler when CONDENSEIT_SCHEDULER_ENABLED=1).
# Times are interpreted in the configured timezone (24-hour HH:MM).
# timezone: IANA timezone name (e.g. "America/New_York", "Europe/London", "Asia/Tokyo").
#   Defaults to "UTC". Can also be set via the Admin > Schedule UI.
schedule:
  timezone: "UTC"
  times: ["07:00", "18:00"]

feeds:
  # General News
  - url: "https://www.theguardian.com/europe/rss"
    category: "General News"
    priority: 2
  - url: "https://www.theguardian.com/world/rss"
    category: "General News"
    priority: 2

  # Developer News
  - url: "https://cursor.com/changelog/rss.xml"
    category: "Developer News"
    priority: 1

  # Infosec News
  - url: "https://www.darkreading.com/rss.xml"
    category: "Infosec News"
    priority: 1
  - url: "https://feeds.feedburner.com/TheHackersNews"
    category: "Infosec News"
    priority: 1
  - url: "https://www.bleepingcomputer.com/feed/"
    category: "Infosec News"
    priority: 1

youtube_channels: []

# ---------------------------------------------------------------------------
# YouTube transcription (audio-based via OpenRouter Whisper API)
#
# When enabled, videos that lack captions are transcribed by downloading
# the audio with yt-dlp and sending it to OpenRouter's Whisper endpoint.
# Requires: yt-dlp + ffmpeg installed on the server, OpenRouter API key set.
# Cost: ~$0.006/min of audio (whisper-large-v3-turbo is cheaper and faster).
# Disabled by default; enable in Admin > Settings or here.
# ---------------------------------------------------------------------------
youtube_transcription:
  enabled: false
  model: "openai/whisper-large-v3-turbo"
  # Skip videos longer than this (seconds). Default 1800 = 30 minutes.
  max_duration_seconds: 1800

watch_urls: []

# ---------------------------------------------------------------------------
# The source types below (google_news, hackernews, reddit, github_releases)
# are managed entirely through Admin > Sources in the web UI. They are not
# configurable via config.yaml; the entries here are for reference only.
#
# Google News search - no API key required.
# Supports operators: site:, when:, intitle:, source:, inurl:
# Example queries:
#   "site:reuters.com when:1d"
#   "CVE intitle:critical when:7d"
#   "\"supply chain\" site:bleepingcomputer.com"
#
# Hacker News - no API key required.
# Feeds: top, best, new, ask, show
# Configure min_score and max_items via the UI.
#
# Reddit - no API key required.
# Any public subreddit, e.g. netsec, machinelearning, programming
# Supports hot/new/top/rising with time filter and min score.
#
# GitHub Releases - no API key required.
# Enter the repo as owner/repo, e.g. astral-sh/uv or ollama/ollama
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Keyword exclusion filter
# Articles whose title or description (first 500 chars) contains any of
# these phrases (case-insensitive substring match) are dropped before
# ranking. Add as many entries as needed; empty list disables the filter.
# ---------------------------------------------------------------------------
exclude_keywords:
  - "Community Forum"
  - "promotional code"
  - "promotional campaign"
#  - "sponsored"

relevance:
  # Minimum ratings before preference learning activates.
  min_ratings_for_learning: 5
  # Weight of the TF-IDF cosine similarity component (term-level profile).
  tfidf_preference_weight: 0.35
  # Weight applied to per-category mean-rating deviation from neutral (3.0).
  category_preference_weight: 0.6
  # Weight applied to per-source (feed) mean-rating deviation from neutral.
  source_preference_weight: 0.3
  # Exponential time-decay half-life in days (e.g. 30 = rating from 30 days
  # ago contributes half as much as one made today).
  rating_decay_half_life_days: 30
  # How strongly implicit engagement signals (read, saved for later, dismissed)
  # influence ranking relative to explicit star ratings.
  # 0 = disabled; 0.5 = half the weight of star ratings; 1.0 = equal weight.
  # All six relevance weights can also be overridden live in Admin > Settings.
  implicit_signal_weight: 0.5

  # Category balancing gate.
  # Category balancing normally guarantees a slot to every category so the
  # digest stays varied. These settings can stop categories you consistently
  # rate poorly from being force-fed. Scores are learned per category in
  # mean-rating-minus-3 units (positive = liked, negative = disliked).
  #   - A category at/below category_exclude_threshold is dropped entirely.
  #   - A category at/below category_demote_threshold keeps at most
  #     category_demote_cap slots and loses its guaranteed slot.
  #   - A category is only gated once it has at least category_min_ratings
  #     explicit ratings, so a stated-interest category with a couple of early
  #     bad ratings is not buried before it can be re-rated.
  # Defaults of -5.0 effectively disable both gates (scores never go that low),
  # so per-article ranking handles everything. Raise toward 0 to activate.
  # category_exclude_threshold: -5.0
  # category_demote_threshold: -5.0
  # category_demote_cap: 1
  # category_min_ratings: 8

  # Topics you never want to read about. Used as a soft negative ranking signal
  # and surfaced to the LLM reranker. Onboarding writes these to the database
  # (bootstrap_dislikes); listing them here is optional and additive.
  # disliked_keywords: ["crypto", "sports", "celebrity news"]

  # Semantic (embedding-based) duplicate detection.
  # Requires embedding_provider to be set to "ollama", "openrouter", or "openai".
  # When enabled, articles covering the same story across different sources are
  # collapsed to the highest-ranked version using cosine similarity on embeddings.
  # embedding_provider: "ollama"       # "ollama", "openrouter", "openai", "custom", or "off"
  # embedding_model: "nomic-embed-text" # For OpenAI-compatible providers: model name on the server
  # semantic_dedup_enabled: true
  # semantic_dedup_threshold: 0.85  # practical range: 0.80 (aggressive) - 0.90 (conservative)
  # Endpoint and key are selected in Admin > Providers; `custom` can be used for
  # any OpenAI-compatible `/v1/embeddings` server.

  initial_keywords:
    high: ["kubernetes", "CVE", "security", "breaking change", "cursor", "llm"]
    medium: ["docker", "github", "python", "go", "rust", "fpv", "drone"]

  # Optional synonym groups: terms in the same group propagate profile weight
  # to each other during scoring. Keys are arbitrary labels; values are
  # lists of equivalent lowercase terms.
  # topic_synonyms:
  #   kubernetes: ["k8s", "helm", "kubectl"]
  #   security:   ["infosec", "cybersecurity", "appsec"]
  #   ai:         ["llm", "gpt", "generative"]

output:
  format: "both"
  path: "data/digests"

# ---------------------------------------------------------------------------
# LLM configuration
#
# LiteLLM provides one model-calling backend for OpenRouter, OpenAI, Anthropic,
# Gemini, Groq, Mistral, DeepSeek, Together AI, Ollama, and custom
# OpenAI-compatible servers.
#
# ``provider`` selects the active backend. ``model`` above is the active model
# identifier. Endpoint overrides are managed live in Admin > Providers.
# ---------------------------------------------------------------------------
llm:
  provider: "openrouter"
  providers:
    openrouter:
      base_url: "https://openrouter.ai/api/v1"
    openai:
      base_url: "https://api.openai.com/v1"
    custom:
      # Set this to any server exposing /v1/chat/completions.
      base_url: ""

  # OpenRouter budget controls. The key comes from Admin > Providers or
  # OPENROUTER_API_KEY.
  openrouter_daily_budget_usd: 1.0
  openrouter_monthly_budget_usd: 10.0
  openrouter_pick_cheapest: false

  # Provider-neutral reasoning controls. Unsupported providers safely ignore
  # optional controls through LiteLLM.
  reasoning_effort: "none"  # none, minimal, low, medium, high, xhigh
  thinking_enabled: false
  thinking_budget_tokens: 0

  # Local Ollama lifecycle. The endpoint can also be edited under Providers.
  ollama_host: "${OLLAMA_HOST:-http://localhost:11434}"
  manage_lifecycle: true

# Existing ``openrouter_model``, ``openai_base_url``, and ``openai_model`` keys
# remain readable for older config files and are migrated into the unified
# provider/model settings when the application starts.

# VPS deployment (used by scripts/deploy.sh)
# Leave host empty until you have a real SSH target.
# Override with DIGEST_PWA_SSH_HOST, DIGEST_PWA_REMOTE_DIR, DIGEST_PWA_LIVE_URL.
# ---------------------------------------------------------------------------
vps:
  enabled: true
  host: ""
  path: "/var/www/elpis.example.com"
  ssh_key: "~/.ssh/id_ed25519"
  ssh_port: 22
  digest_url: "https://elpis.example.com"

